services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: spendi
      POSTGRES_USER: spendi
      POSTGRES_PASSWORD: ${SPENDI_DB_PASSWORD:?Set SPENDI_DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spendi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendi -d spendi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  spendi-postgres:
